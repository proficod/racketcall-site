<style>
/* The same quiet system as racketcall.com: dark grounds, white cards, one blue for actions, scores in cells. */
:root {
  --bg: #000000; --card: #1c1c1e; --soft: #2c2c2e; --ink: #f5f5f7; --muted: #8e8e93; --line: #38383a;
  --blue: #9e1f42; --blue-hover: #b3264d; --link: #e8728f; --ball: #c9e52b;
  --cell: #f5f5f7; --cell-ink: #1d1d1f; --cell-off: #2c2c2e; --cell-off-ink: #8e8e93;
  --up: #30d158; --down: #ff453a; --live: #ff453a; --wire: #5a5a5f; --adv: #c9e52b; --adv-ink: #1d2400;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --nav: rgba(0,0,0,.72); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 6px; }
.inner { width: 100%; max-width: 1180px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

/* Frosted bar */
.bar { position: sticky; top: 0; z-index: 20; background: var(--nav); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.bar .inner { display: flex; align-items: center; justify-content: space-between; height: 52px; }
.logo { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
.logo svg { width: 22px; height: 22px; }
.pill { font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 980px; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
.pill.live { color: var(--live); }
.pill.live::before, .live-tag::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: blink 1.2s ease-in-out infinite alternate; }
@keyframes blink { from { opacity: 1 } to { opacity: .3 } }

/* Intro */
.intro { padding-block: 34px 6px; display: grid; gap: 22px; }
.eyebrow { margin: 0 0 6px; color: var(--muted); font-size: 15px; font-weight: 500; }
.eyebrow:empty { display: none; }
h1 { margin: 0; font-size: clamp(34px, 6vw, 56px); line-height: 1.05; font-weight: 700; letter-spacing: -.03em; text-wrap: balance; overflow-wrap: anywhere; }
.meta { margin: 8px 0 0; color: var(--muted); font-size: 17px; }
.invite { background: var(--card); border-radius: 22px; padding: 20px; display: grid; gap: 14px; max-width: 560px; }
.invite h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.code { display: flex; gap: 6px; user-select: all; }
.code span { flex: 1 1 0; max-width: 52px; aspect-ratio: 4 / 5; display: grid; place-items: center; border-radius: 10px; background: var(--soft); color: var(--ink);
  font: 600 clamp(22px, 6vw, 28px)/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
.buttons { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 200px; text-align: center; font-size: 15px; font-weight: 500; padding: 12px 16px; border-radius: 980px; background: var(--soft); color: var(--ink); border: 0; cursor: pointer; font-family: inherit; transition: background .2s ease; }
.btn.primary { background: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-hover); }

/* Board */
main.inner { padding-block: 20px 56px; display: grid; gap: 22px; }
.tabs { display: inline-flex; justify-self: start; gap: 2px; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tabs button { flex: none; font: 500 14px/1 var(--font); padding: 9px 16px; border-radius: 9px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.tabs button.on { background: var(--soft); box-shadow: 0 1px 4px rgba(0,0,0,.4); font-weight: 600; }
h2 { margin: 14px 0 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -.025em; }
h3 { margin: 0; font-size: 13px; line-height: 16px; font-weight: 600; color: var(--muted); }

.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 16px; align-items: start; }
.card { background: var(--card); border-radius: 22px; }
.group { overflow: hidden; display: grid; min-width: 0; }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 18px; }
.group-letter { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.group-done { font-size: 13px; font-weight: 500; color: var(--muted); }
.table-wrap { overflow-x: auto; }
/* Fixed columns: every group's table lines up the same */
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; padding: 8px 4px; }
td { padding: 11px 4px; text-align: center; border-top: 1px solid var(--line); font-size: 15px; }
th:nth-child(1), td:nth-child(1) { width: 46px; padding-left: 18px; text-align: left; }
th:nth-child(3), td:nth-child(3) { width: 40px; }
th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5) { width: 46px; }
th:nth-child(6), td:nth-child(6) { width: 58px; padding-right: 18px; }
th.name, td.name { text-align: left; }
td.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.name .person { display: flex; align-items: center; gap: 8px; min-width: 0; }
td.name .person > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.faces { display: inline-flex; flex: none; }
.face { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; overflow: hidden;
  font-size: 10px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--accent), #5b1530); }
.face + .face { margin-left: -8px; box-shadow: 0 0 0 2px var(--card, #1a0d12); }
.face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.podium .face { width: 44px; height: 44px; font-size: 16px; }
.podium .face + .face { margin-left: -14px; }
td.pos { color: var(--muted); font-weight: 600; }
td.w { font-weight: 700; }
td.gd.up { color: var(--up); font-weight: 600; } td.gd.down { color: var(--down); font-weight: 600; }
tr.adv td.pos span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--adv); color: var(--adv-ink); font-size: 12px; }
.matches { display: grid; padding: 4px 18px 10px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--soft) 55%, var(--card)); }
.m { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; font-size: 15px; }
.m + .m { border-top: 1px solid var(--line); }
.m .who { display: grid; gap: 5px; min-width: 0; }
.m .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.m .who span.w { color: var(--ink); font-weight: 600; }
table.points th:nth-child(3), table.points td:nth-child(3) { width: 70px; white-space: nowrap; }
table.points th:nth-child(4), table.points td:nth-child(4) { width: 46px; }
.m .who span.court { font-size: 12px; font-weight: 600; color: var(--muted); }
.sets { display: grid; grid-auto-flow: column; gap: 4px; align-items: center; justify-content: end; }
.setcol { display: grid; gap: 5px; }
.cell { min-width: 24px; height: 22px; padding: 0 5px; display: grid; place-items: center; border-radius: 6px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--cell-off); color: var(--cell-off-ink); }
.cell.win { background: var(--cell); color: var(--cell-ink); }
.total { font-size: 15px; line-height: 22px; font-weight: 700; color: var(--ink); text-align: center; margin-right: 4px; }
.sub { display: block; font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }
.live-tag { display: block; font-size: 12px; font-weight: 600; color: var(--live); text-align: right; white-space: nowrap; margin-top: 4px; }

/* Bracket: rounds share one height, each match sits in an equal slot, so the lines meet exactly */
.bracket { display: flex; gap: 32px; align-items: stretch; }
.round { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.round-body { flex: 1; display: grid; grid-auto-rows: 1fr; }
.pair { display: grid; grid-template-rows: 1fr 1fr; position: relative; }
.pair:not(.two) { grid-template-rows: 1fr; }
.slot { display: flex; align-items: center; padding-block: 7px; position: relative; min-width: 0; }
.slot > .bm { width: 100%; }
.round:not(:last-child) .slot::after { content: ""; position: absolute; left: 100%; top: 50%; width: 17px; height: 2px; margin-top: -1px; background: var(--wire); }
.round:not(:last-child) .pair.two::before { content: ""; position: absolute; left: calc(100% + 15px); width: 2px; top: calc(25% - 1px); bottom: calc(25% - 1px); background: var(--wire); }
.round:not(:first-child) .slot::before { content: ""; position: absolute; right: 100%; top: 50%; width: 16px; height: 2px; margin-top: -1px; background: var(--wire); }
.bm { background: var(--card); border-radius: 14px; overflow: hidden; }
.bm .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; font-size: 15px; color: var(--muted); }
.bm .row + .row { border-top: 1px solid var(--line); }
.bm .row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bm .row.w { color: var(--ink); font-weight: 600; }
.bm .cells { display: flex; gap: 4px; flex: none; }
.bm.tbd .row { color: var(--muted); }
.bm.final { box-shadow: 0 0 0 2px var(--ink); }
.bm .live-tag { text-align: left; padding: 0 12px 9px; margin: 0; }
.third { display: grid; gap: 10px; margin-top: 14px; max-width: calc((100% - 32px * (var(--cols, 2) - 1)) / var(--cols, 2)); margin-left: auto; }
.champion { display: inline-flex; align-items: center; gap: 6px; }
.champion::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ball); flex: none; }

/* Sign-up before the draw */
.signup { padding: 24px; display: grid; gap: 14px; max-width: 640px; }
.signup h2 { margin: 0; font-size: 28px; }
.signup .meta { margin: 0; font-size: 15px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { font: 400 17px/1.2 var(--font); color: var(--ink); background: var(--soft); border: 1px solid transparent; border-radius: 12px; padding: 13px 14px; width: 100%; }
.field input:focus { outline: none; border-color: var(--link); box-shadow: 0 0 0 3px color-mix(in srgb, var(--link) 25%, transparent); }
.signup .btn { justify-self: start; min-width: 200px; flex: none; }
.signup .btn:disabled { opacity: .6; }
.note { margin: 0; font-weight: 500; } .note.ok { color: var(--up); } .note.bad { color: var(--down); }

.podium { padding: 22px; display: grid; gap: 8px; text-align: center; }
.podium h2 { margin: 0; font-size: 28px; }
.podium .meta { margin: 0 0 8px; font-size: 17px; }
.podium .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.podium .step { display: grid; justify-items: center; gap: 8px; min-width: 0; }
.podium .medal { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.45); }
.podium .p1 .medal { width: 56px; height: 56px; font-size: 24px; background: linear-gradient(135deg, #ffe17a, #d39a1a); }
.podium .p2 .medal { background: linear-gradient(135deg, #eef1f5, #9ea7b2); }
.podium .p3 .medal { background: linear-gradient(135deg, #eea96c, #9d5c2b); }
.podium .who { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.podium .block { width: 100%; border-radius: 12px 12px 4px 4px; background: color-mix(in srgb, var(--blue) 55%, var(--card)); }
.podium .p1 .block { height: 96px; } .podium .p2 .block { height: 68px; opacity: .8; } .podium .p3 .block { height: 48px; opacity: .65; }
.foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 13px; padding-top: 16px; border-top: 1px solid var(--line); }
.foot a { font-weight: 500; }

@media (prefers-reduced-motion: reduce) { .pill.live::before, .live-tag::before { animation: none; } }
/* Phones: rounds one under another, no sideways scrolling */
@media (max-width: 760px) {
  .bracket { flex-direction: column; gap: 22px; }
  .round-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; }
  .pair { display: contents; }
  .slot { padding: 0; }
  .round .slot::before, .round .slot::after, .round .pair.two::before { display: none; }
  .third { max-width: none; margin-left: 0; }
  .groups { grid-template-columns: 1fr; }
  .signup .btn { justify-self: stretch; }
  .intro { padding-top: 24px; }
}
</style>
</head>

// --- The same rules as the app (Packages/ScoreKit/ClubTournament.swift) ---
const key = (o) => Object.keys(o)[0];
const winnerOf = (r) => { if (!r) return null; let a = 0, b = 0; for (const s of r.sets) { if (s.a > s.b) a++; else if (s.b > s.a) b++; } return a === b ? null : (a > b ? "a" : "b"); };
const games = (r) => r.sets.reduce((g, s) => ({ a: g.a + s.a, b: g.b + s.b }), { a: 0, b: 0 });

function standings(div, group) {
  const rows = new Map(div.groups[group].map((p) => [p, { player: p, played: 0, wins: 0, gw: 0, gl: 0 }]));
  const ms = div.matches.filter((m) => key(m.stage) === "group" && m.stage.group._0 === group);
  for (const m of ms) {
    if (key(m.a) !== "player" || key(m.b) !== "player" || !m.result) continue;
    const a = m.a.player._0, b = m.b.player._0, g = games(m.result), w = winnerOf(m.result);
    for (const [p, own, other, side] of [[a, g.a, g.b, "a"], [b, g.b, g.a, "b"]]) {
      const r = rows.get(p); if (!r) continue; r.played++; r.gw += own; r.gl += other; if (w === side) r.wins++;
    }
  }
  const rank = (tied, criteria) => {
    if (tied.length < 2) return tied;
    if (!criteria.length) return tied.sort((x, y) => div.lots[x] - div.lots[y]);
    const set = new Set(tied), c = criteria[0];
    const value = (p) => {
      const r = rows.get(p);
      if (c === "wins") return r.wins; if (c === "gameDifference") return r.gw - r.gl; if (c === "gamesWon") return r.gw;
      return ms.filter((m) => key(m.a) === "player" && key(m.b) === "player" && set.has(m.a.player._0) && set.has(m.b.player._0)
        && winnerOf(m.result) && (winnerOf(m.result) === "a" ? m.a.player._0 : m.b.player._0) === p).length;
    };
    const buckets = new Map(); for (const p of tied) { const v = value(p); if (!buckets.has(v)) buckets.set(v, []); buckets.get(v).push(p); }
    return [...buckets.keys()].sort((x, y) => y - x).flatMap((v) => rank(buckets.get(v), criteria.slice(1)));
  };
  return rank([...div.groups[group]], div.rules.ranking).map((p) => rows.get(p));
}
// Final order of a level with groups and playoffs, as in the app: the playoffs first (final, 3rd place…),
// then everyone else by group place, wins and game difference.
function finalRanking(div) {
  const rank = new Map();
  div.groups.forEach((_, g) => standings(div, g).forEach((r, place) => rank.set(r.player, { place, wins: r.wins, diff: r.gw - r.gl })));
  const byGroup = (a, b) => { const x = rank.get(a) || { place: 99, wins: 0, diff: 0 }, y = rank.get(b) || { place: 99, wins: 0, diff: 0 };
    return (x.place - y.place) || (y.wins - x.wins) || (y.diff - x.diff) || ((div.lots || [])[a] - (div.lots || [])[b]); };
  const placed = new Set(), order = [];
  div.rules.playoffs.forEach((rule, bracket) => {
    const ms = div.matches.filter((m) => (key(m.stage) === "playoff" && m.stage.playoff.bracket === bracket) || (key(m.stage) === "thirdPlace" && m.stage.thirdPlace.bracket === bracket));
    const last = Math.max(0, ...ms.filter((m) => key(m.stage) === "playoff").map((m) => m.stage.playoff.round));
    const score = new Map();
    for (const m of ms) {
      const w = winnerOf(m.result);
      for (const [e, side] of [[m.a, "a"], [m.b, "b"]]) {
        const p = participant(div, e); if (typeof p !== "number") continue;
        let v = 0;
        if (key(m.stage) === "playoff") { v = m.stage.playoff.round; if (m.stage.playoff.round === last && w === side) v += 1; }
        else v = last - 1 + (w === side ? 0.5 : 0.25);
        score.set(p, Math.max(score.get(p) || 0, v));
      }
    }
    const entrants = [...score.keys()].filter((p) => !placed.has(p)).sort((a, b) => score.get(a) === score.get(b) ? byGroup(a, b) : score.get(b) - score.get(a));

  const card = el("section", "card podium");
  card.append(el("h2", "", t.podium), el("p", "meta", t.champ.replace("%", names[0])));
  const steps = el("div", "steps");
  [1, 0, 2].forEach((place) => {
    if (place >= names.length) { steps.appendChild(el("div", "step empty")); return; }
    const step = el("div", "step p" + (place + 1));
    step.append(el("span", "medal", place + 1), faces(items[place].people), el("span", "who", names[place]), el("span", "block", ""));
    steps.appendChild(step);
  });
  card.appendChild(steps);
  return card;
}

const groupDone = (div, g) => div.matches.every((m) => key(m.stage) !== "group" || m.stage.group._0 !== g || m.result);
function participant(div, e) {
  const k = key(e);
  if (k === "player") return e.player._0;
  if (k === "bye") return "bye";
  if (k === "groupPlace") { const { group, place } = e.groupPlace; if (!groupDone(div, group)) return null; const s = standings(div, group); return place - 1 < s.length ? s[place - 1].player : "bye"; }
  const id = e[k].of, m = div.matches.find((x) => x.id === id); if (!m) return null;
  const a = participant(div, m.a), b = participant(div, m.b), wants = k === "winner";
  if (a === "bye" && b === "bye") return "bye";
  if (a === "bye") return wants ? b : "bye"; if (b === "bye") return wants ? a : "bye";
  const w = winnerOf(m.result); if (!w) return null;
  return (w === "a") === wants ? a : b;
}

function render(data) {
  const board = $("board"), levels = $("levels"); board.innerHTML = ""; levels.innerHTML = "";
  $("title").textContent = data.name;
  const status = $("status"); status.hidden = false;
  status.textContent = data.status === "finished" ? t.done : t.live;
  status.className = "pill" + (data.status === "finished" ? "" : " live");
  const results = new Map(data.results.map((r) => [String(r.match_id).toLowerCase(), r]));
  const live = new Map((data.live || []).filter((l) => l.match_id && l.state).map((l) => [String(l.match_id).toLowerCase(), l.state]));
  hasLive = live.size > 0;
  const divisions = data.tournament.divisions;
  for (const d of divisions) for (const m of d.matches) { const r = results.get(m.id.toLowerCase()); if (r && !r.disputed) m.result = { sets: r.sets }; m.meta = r; }
  const over = data.status === "finished" || divisions.every((d) => d.rules.rounds ? roundsDecided(data, d, results) : decided(d));
  status.textContent = over ? t.done : t.live;
  status.className = "pill" + (over ? "" : " live");
  const people = divisions.reduce((n, d) => n + d.players.length, 0);
  $("eyebrow").textContent = data.starts_at ? new Date(data.starts_at).toLocaleDateString(lang, { weekday: "long", day: "numeric", month: "long" }) : "";
  $("hint").textContent = (divisions.length > 1 ? divisions.length + " " + t.levels + " · " : "") + people + " " + t.players;
  $("invite").hidden = over;
  let current = 0; try { current = Math.min(Number(sessionStorage.getItem("level") || 0), divisions.length - 1); } catch (e) {}
  if (divisions.length > 1) divisions.forEach((d, i) => {
    const b = el("button", i === current ? "on" : "", d.rules.name); b.type = "button";
    b.onclick = () => { try { sessionStorage.setItem("level", i); } catch (e) {} render(data); }; levels.appendChild(b);
  });
  levels.hidden = divisions.length < 2;
  const div = divisions[current];
  if (div.rules.rounds) {
    const order = renderRounds(data, div, results);
    if (over) { const p = podium(order); if (p) board.insertBefore(p, board.firstChild); }
    $("updated").textContent = t.updated + " " + new Date().toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });
    return;
  }
  const pname = (e) => { const p = participant(div, e); return p === null ? t.pending : p === "bye" ? "—" : div.players[p].name; };
  if (over) { const p = podium(finalRanking(div).map((i) => ({ name: div.players[i].name, people: entrantPeople(div.players[i]) }))); if (p) board.appendChild(p); }
  // Scoreboard cells: one column per set, the winner of each set filled; more than one set leads with the sets score.
  const setCells = (m) => {
    const box = el("div", "sets"); if (!m.result) return box;
    const sets = m.result.sets;
    if (sets.length > 1) { const w = sets.reduce((c, s) => ({ a: c.a + (s.a > s.b), b: c.b + (s.b > s.a) }), { a: 0, b: 0 });
      const col = el("div", "setcol"); col.append(el("span", "total", w.a), el("span", "total", w.b)); box.appendChild(col); }
    for (const s of sets) { const col = el("div", "setcol");
      col.append(el("span", "cell" + (s.a > s.b ? " win" : ""), s.a), el("span", "cell" + (s.b > s.a ? " win" : ""), s.b)); box.appendChild(col); }
    return box;
  };
  const liveText = (m) => { const now = live.get(m.id.toLowerCase()); if (!now || m.result) return null;
    return (now.gamesA != null ? now.gamesA + "–" + now.gamesB + " · " : "") + now.pointsA + "–" + now.pointsB; };

  // Groups
  const adv = (div.rules.playoffs[0] || { places: [0, 0] }).places[1];
  board.appendChild(el("h2", "", t.tables));
  const grid = el("div", "groups"); board.appendChild(grid);
  div.groups.forEach((_, g) => {
    const card = el("article", "card group"), head = el("div", "group-head");
    head.append(el("span", "group-letter", t.group + " " + String.fromCharCode(65 + g)));
    card.appendChild(head);
    const table = el("table"), hr = el("tr");
    for (const [c, cls] of [["#", "name"], [t.player, "name"], [t.w, ""], [t.gp, ""], [t.gm, ""], ["±", ""]]) hr.appendChild(el("th", cls, c));
    if (groupDone(div, g)) head.append(el("span", "group-done", t.done));
    table.appendChild(hr);
    standings(div, g).forEach((r, i) => {
      const tr = el("tr", i < adv ? "adv" : ""), d = r.gw - r.gl;
      const pos = el("td", "pos"); pos.appendChild(el("span", "", i + 1));
      tr.append(pos, personCell(entrantPeople(div.players[r.player]), div.players[r.player].name), el("td", "w", r.wins),
                el("td", "", r.gw), el("td", "", r.gl), el("td", "gd" + (d > 0 ? " up" : d < 0 ? " down" : ""), (d > 0 ? "+" : "") + d));
      table.appendChild(tr);
    });
    const tw = el("div", "table-wrap"); tw.appendChild(table); card.appendChild(tw);
    const list = el("div", "matches");
    div.matches.filter((m) => key(m.stage) === "group" && m.stage.group._0 === g).forEach((m) => {
      const row = el("div", "m"), who = el("div", "who"), w = winnerOf(m.result);
      who.append(el("span", w === "a" ? "w" : "", pname(m.a)), el("span", w === "b" ? "w" : "", pname(m.b)));
      const sc = el("div", "score"), lt = liveText(m); sc.appendChild(setCells(m));
      if (lt) sc.appendChild(el("span", "live-tag", t.live + " " + lt));
      if (m.meta && !m.meta.confirmed && !m.meta.disputed) sc.appendChild(el("span", "sub", t.unconfirmed));
      row.append(who, sc); list.appendChild(row);
    });
    card.appendChild(list); grid.appendChild(card);
  });

  // Playoffs: rounds as columns, pairs joined by bracket lines.
  div.rules.playoffs.forEach((rule, bracket) => {
    const ms = div.matches.filter((m) => key(m.stage) === "playoff" && m.stage.playoff.bracket === bracket);
    const third = div.matches.filter((m) => key(m.stage) === "thirdPlace" && m.stage.thirdPlace.bracket === bracket);
    if (!ms.length) return;
    board.appendChild(el("h2", "", bracket === 0 ? t.main : t.cons));
    const wrap = el("div", "bracket-wrap"), row = el("div", "bracket"); wrap.appendChild(row); board.appendChild(wrap);
    const slot = (m, isFinal) => { const s = el("div", "slot"); s.appendChild(bracketMatch(m, isFinal)); return s; };
    const last = Math.max(...ms.map((m) => m.stage.playoff.round));
    const first = Math.min(...ms.filter((m) => key(m.a) !== "bye" && key(m.b) !== "bye").map((m) => m.stage.playoff.round));
    for (let r = first; r <= last; r++) {
      const col = el("div", "round"), body = el("div", "round-body");
      col.appendChild(el("h3", "", last - r === 0 ? t.final : last - r === 1 ? t.semis : last - r === 2 ? t.quarters : t.round + " " + r));
      const list = ms.filter((m) => m.stage.playoff.round === r);
      if (r === last) list.forEach((m) => body.appendChild(slot(m, true)));
      else for (let i = 0; i < list.length; i += 2) {
        const two = list.slice(i, i + 2), pair = el("div", "pair" + (two.length === 2 ? " two" : ""));
        two.forEach((m) => pair.appendChild(slot(m, false)));
        body.appendChild(pair);
      }
      col.appendChild(body);
      row.appendChild(col);
    }
    // The 3rd-place match sits under the final, outside the rounds, so it doesn't change their heights.
    if (third.length) {
      const t3 = el("div", "third"), n = last - first + 1; t3.appendChild(el("h3", "", t.third));
      t3.style.setProperty("--cols", n);
      third.forEach((m) => t3.appendChild(bracketMatch(m, false))); wrap.appendChild(t3);
    }
  });

  function bracketMatch(m, isFinal) {
    const a = participant(div, m.a), b = participant(div, m.b), w = winnerOf(m.result);
    const card = el("div", "bm" + (a === null || b === null ? " tbd" : "") + (isFinal ? " final" : ""));
    for (const [side, p] of [["a", a], ["b", b]]) {
      const r = el("div", "row" + (w === side ? " w" : ""));
      const nm = el("span", "", p === null ? t.pending : p === "bye" ? "—" : div.players[p].name);
      if (isFinal && w === side) nm.className = "champion";
      const pts = el("span", "cells");
      if (m.result) for (const s of m.result.sets) { const own = side === "a" ? s.a : s.b, other = side === "a" ? s.b : s.a; pts.appendChild(el("span", "cell" + (own > other ? " win" : ""), own)); }
      r.append(nm, pts); card.appendChild(r);
    }
    const lt = liveText(m);
    if (lt) card.appendChild(el("span", "live-tag", t.live + " " + lt));
    return card;
  }
  $("updated").textContent = t.updated + " " + new Date().toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });
}

// Before the draw: the tournament's name and a sign-up form for players without an iPhone.
let signupShown = false;
function renderDraft(data) {
  $("title").textContent = data.name;
  const status = $("status"); status.hidden = false; status.textContent = t.signupOpen; status.className = "pill";
  $("eyebrow").textContent = data.starts_at ? new Date(data.starts_at).toLocaleDateString(lang, { weekday: "long", day: "numeric", month: "long" }) : "";
  $("hint").textContent = t.hint;
  $("updated").textContent = "";
  if (signupShown) return; // keep what the visitor is typing
  signupShown = true;
  const board = $("board"); board.innerHTML = "";
  const card = el("form", "card signup"); card.noValidate = true;
  card.append(el("h2", "", t.h), el("p", "meta", t.p));
  const row = el("div", "fields");
  const field = (id, label, auto) => {
    const wrap = el("label", "field"); wrap.htmlFor = id;
    const input = el("input"); input.id = id; input.name = id; input.required = true; input.maxLength = 40; input.autocomplete = auto;
    wrap.append(el("span", "", label), input); row.appendChild(wrap); return input;
  };
  const first = field("first", t.first, "given-name"), last = field("last", t.last, "family-name");
  const button = el("button", "btn primary", t.send); button.type = "submit";
  const note = el("p", "note"); note.setAttribute("role", "status");
  card.append(row, button, note); board.appendChild(card);
  let done = false; try { done = localStorage.getItem("signed:" + code) === "1"; } catch (e) {}
  const showDone = () => { row.hidden = true; button.textContent = t.again; note.className = "note ok"; note.textContent = t.ok; };
  if (done) showDone();
  card.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (row.hidden) { row.hidden = false; first.value = ""; last.value = ""; button.textContent = t.send; note.textContent = ""; first.focus(); return; }
    const f = first.value.trim(), l = last.value.trim();
    if (!f || !l) { note.className = "note bad"; note.textContent = t.invalid; return; }
    button.disabled = true; button.textContent = t.sending; note.textContent = "";
    let answer = "fail";
    try {
      const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/club_signup", {
        method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_code: code, p_first: f, p_last: l }) });
      if (response.ok) answer = await response.json();
    } catch (e) {}
    button.disabled = false; button.textContent = t.send;
    if (answer === "ok") { try { localStorage.setItem("signed:" + code, "1"); } catch (e) {} showDone(); }
    else { note.className = "note bad"; note.textContent = t[answer] || t.fail; }
  });
}

// A level played in rounds (Americano, Mexicano, King of the Court, Team Americano, Swiss): the rounds by time and court,
// then the points table. The rounds come from the app (every phone computes the same ones); scores from club_results.
function renderRounds(data, div, results) {
  const board = $("board"), setup = div.rules.rounds, tour = data.tournament;
  const pairs = setup.mode === "teamAmericano" || setup.mode === "swiss";
  const players = pairs ? div.players.flatMap((p) => { const n = String(p.name).split(" / "); return [n[0], n[1] || n[0]]; })
                        : div.players.map((p) => p.name);
  const photos = pairs ? div.players.flatMap((p) => [p.avatar, p.avatar2]) : div.players.map((p) => p.avatar);
  const courts = (div.rules.courts && div.rules.courts.length) ? div.rules.courts : (tour.courts || []);
  const start = tour.start ? new Date(tour.start) : null, slot = tour.slotMinutes || 0;
  const rows = (data.rounds || []).filter((r) => r.level === String(div.id).toLowerCase()).sort((a, b) => a.number - b.number);
  const score = (id) => { const r = results.get(String(id).toLowerCase()); return r && !r.disputed && r.sets && r.sets[0] ? r.sets[0] : null; };
  const names = (team) => team.map((i) => players[i] || "—").join(" / ");
  board.appendChild(el("h2", "", t.rounds));
  for (let n = 1; n <= setup.rounds; n++) {
    const card = el("article", "card group"), head = el("div", "group-head");
    head.append(el("span", "group-letter", t.rnd + " " + n));
    if (start) head.append(el("span", "group-done", new Date(start.getTime() + (n - 1) * slot * 60000).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" })));
    card.appendChild(head);
    const list = el("div", "matches"), round = rows.find((r) => r.number === n);
    if (!round) list.appendChild(el("div", "m", t.later));
    else {
      round.matches.forEach((m) => {
        const row = el("div", "m"), who = el("div", "who"), s = score(m.id);
        const w = s ? (s.a > s.b ? "a" : s.b > s.a ? "b" : null) : null;
        who.append(el("span", "court", t.court + " " + (courts[m.court - 1] || m.court)));
        who.append(el("span", w === "a" ? "w" : "", names(m.teamA)), el("span", w === "b" ? "w" : "", names(m.teamB)));
        const sc = el("div", "score");
        if (s) { const box = el("div", "sets"), col = el("div", "setcol");
          col.append(el("span", "cell" + (w === "a" ? " win" : ""), s.a), el("span", "cell" + (w === "b" ? " win" : ""), s.b)); box.appendChild(col); sc.appendChild(box); }
        row.append(who, sc); list.appendChild(row);
      });
      if (round.resting && round.resting.length) list.appendChild(el("div", "m", t.rest + ": " + round.resting.map((i) => players[i]).join(", ")));
    }
    card.appendChild(list); board.appendChild(card);
  }
  // Points table, like the app: points (or wins first for Swiss and King of the Court), then wins, then difference.
  const table = players.map((name, i) => ({ i, name, pts: 0, against: 0, w: 0, d: 0, l: 0 }));
  rows.forEach((r) => r.matches.forEach((m) => { const s = score(m.id); if (!s) return;
    [[m.teamA, s.a, s.b], [m.teamB, s.b, s.a]].forEach(([team, own, other]) => team.forEach((i) => { const p = table[i]; if (!p) return;
      p.pts += own; p.against += other; if (own > other) p.w++; else if (own === other) p.d++; else p.l++; })); }));
  const winsFirst = setup.mode === "swiss" || setup.mode === "kingOfTheCourt";
  const order = table.slice().sort((x, y) => winsFirst
    ? (y.w - x.w) || (y.pts - x.pts) || ((y.pts - y.against) - (x.pts - x.against)) || (x.i - y.i)
    : (y.pts - x.pts) || (y.w - x.w) || ((y.pts - y.against) - (x.pts - x.against)) || (x.i - y.i));
  const shown = (pairs ? order.filter((p) => p.i % 2 === 0).map((p) => ({ ...p, name: p.name + " / " + (players[p.i + 1] || ""),
    people: [{ name: players[p.i], avatar: photos[p.i] }, { name: players[p.i + 1], avatar: photos[p.i + 1] }] }))
    : order.map((p) => ({ ...p, people: [{ name: p.name, avatar: photos[p.i] }] })));
  board.appendChild(el("h2", "", t.standings));
  const card = el("article", "card group"), wrap = el("div", "table-wrap"), tbl = el("table", "points"), hr = el("tr");
  for (const [c, cls] of [["#", "name"], [t.player, "name"], [t.wdl, ""], ["±", ""], [t.pts, ""]]) hr.appendChild(el("th", cls, c));
  tbl.appendChild(hr);
  shown.forEach((p, k) => { const tr = el("tr", k < 3 ? "adv" : ""), pos = el("td", "pos"); pos.appendChild(el("span", "", k + 1));
    const d = p.pts - p.against;
    tr.append(pos, personCell(p.people, p.name), el("td", "", p.w + "-" + p.d + "-" + p.l), el("td", "gd" + (d > 0 ? " up" : d < 0 ? " down" : ""), (d > 0 ? "+" : "") + d), el("td", "w", p.pts));
    tbl.appendChild(tr); });
  wrap.appendChild(tbl); card.appendChild(wrap); board.appendChild(card);
  return shown.map((p) => ({ name: p.name, people: p.people }));
}

async function load() {
  if (code.length !== 6) return;
  try {
    const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/public_club_tournament", {
      method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_code: code }) });
    const data = await response.json();
    isOn = !!(data && data.status === "live");
    if (data && data.tournament) { signupShown = false; render(data); }
    else if (data && data.status === "draft") renderDraft(data);
    else $("updated").textContent = t.notFound;
  } catch (e) { /* offline: keep what's on screen */ }
}
// Every 15 seconds while a match is live, otherwise every minute.
// Updates by itself: every 15 seconds while the tournament is on, every minute before it starts or after it ends.
let isOn = false;
async function loop() { await load(); setTimeout(loop, hasLive || isOn ? 15000 : 60000); }
loop();
</script>
