<style>
/* A hard court at night: court-blue band with chalk lines, optic-yellow ball for what matters, scores in scoreboard cells. */
:root {
  --bg: #f3f2ec; --surface: #ffffff; --surface-2: #ebeae2; --ink: #101a2b; --muted: #5f6878; --line: #dcdbd1;
  --court: #0b5cff; --court-2: #173d72; --chalk: #ffffff; --ball: #d5ee2d; --ball-ink: #1b2300;
  --cell: #101a2b; --cell-ink: #ffffff; --cell-lose: #e3e2d9; --cell-lose-ink: #5f6878;
  --up: #1d7a46; --down: #b8433b; --live: #e2332b; --adv: #d5ee2d;
  --display: "Anton", "Oswald", "Impact", "Arial Narrow", sans-serif;
  --font: "Plus Jakarta Sans", "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #090f1a; --surface: #101a2a; --surface-2: #162236; --ink: #eef1f6; --muted: #8e99ad; --line: #1f2c43;
  --court: #173f78; --court-2: #10305e; --chalk: #ffffff; --ball: #dcf24a; --ball-ink: #1b2300;
  --cell: #dcf24a; --cell-ink: #1b2300; --cell-lose: #1f2c43; --cell-lose-ink: #8e99ad;
  --up: #5bd08b; --down: #ff7a70; --live: #ff5248; --adv: #dcf24a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #090f1a; --surface: #101a2a; --surface-2: #162236; --ink: #eef1f6; --muted: #8e99ad; --line: #1f2c43;
  --court: #173f78; --court-2: #10305e; --chalk: #ffffff; --ball: #dcf24a; --ball-ink: #1b2300;
  --cell: #dcf24a; --cell-ink: #1b2300; --cell-lose: #1f2c43; --cell-lose-ink: #8e99ad;
  --up: #5bd08b; --down: #ff7a70; --live: #ff5248; --adv: #dcf24a; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); font-stretch: 100%; -webkit-font-smoothing: antialiased; }
.inner { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Court band */
.band { position: relative; overflow: hidden; color: var(--chalk); background: radial-gradient(120% 120% at 85% 0%, #1d7bff 0%, #0b5cff 26%, #06246b 62%, #041437 100%); }
.band svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.band .inner { position: relative; padding-block: 18px 30px; display: grid; gap: 22px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; gap: 9px; color: var(--chalk); text-decoration: none; font: 400 22px/1 var(--display); letter-spacing: .01em; text-transform: uppercase; }
.ball { width: 22px; height: 22px; flex: none; }
.pill { font: 700 11px/1 var(--font); font-stretch: 110%; letter-spacing: .12em; text-transform: uppercase; padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,.14); color: var(--chalk); }
.pill.live { background: var(--chalk); color: var(--live); }
.pill.live::before, .live-tag::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: blink 1.1s infinite alternate; }
@keyframes blink { from { opacity: 1 } to { opacity: .25 } }
@media (prefers-reduced-motion: reduce) { .pill.live::before, .live-tag::before { animation: none; } }
.eyebrow { margin: 0 0 6px; font: 700 12px/1 var(--font); font-stretch: 115%; letter-spacing: .16em; text-transform: uppercase; color: var(--ball); }
h1 { margin: 0; font: 400 clamp(44px, 9vw, 84px)/.9 var(--display); letter-spacing: 0; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
.meta { margin: 10px 0 0; color: rgba(255,255,255,.78); font-size: 15px; }

/* Invite: the code as scoreboard tiles */
.invite { display: grid; gap: 14px; padding: 16px; border-radius: 16px; background: rgba(6, 16, 34, .34); border: 1px solid rgba(255,255,255,.14); }
.invite h3 { color: rgba(255,255,255,.7); }
.code { display: flex; gap: 6px; user-select: all; }
.code span { flex: 1 1 0; max-width: 54px; aspect-ratio: 4 / 5; display: grid; place-items: center; border-radius: 8px; background: #0b1424; color: var(--ball);
  font: 700 clamp(22px, 6vw, 30px)/1 var(--mono); position: relative; box-shadow: inset 0 -2px 0 rgba(255,255,255,.06); }
.code span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid rgba(0,0,0,.55); }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 200px; text-align: center; font: 700 15px/1 var(--font); font-stretch: 105%; padding: 14px; border-radius: 12px; text-decoration: none; color: var(--chalk); background: rgba(255,255,255,.12); }
.btn.primary { background: var(--ball); color: var(--ball-ink); }
.btn:focus-visible, .tabs button:focus-visible, .foot a:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }

/* Board */
main.inner { padding-block: 22px 56px; display: grid; gap: 20px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: -2px; }
.tabs button { flex: none; font: 700 14px/1 var(--font); font-stretch: 108%; padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
h2 { margin: 8px 0 0; display: flex; align-items: center; gap: 12px; font: 900 13px/1 var(--font); font-stretch: 120%; letter-spacing: .14em; text-transform: uppercase; }
h2::after { content: ""; flex: 1; border-top: 2px solid var(--ink); opacity: .9; }
h3 { margin: 0; font: 700 11px/1 var(--font); font-stretch: 115%; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.group { overflow: hidden; display: grid; min-width: 0; }
.group-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--ink); color: var(--bg); }
.group-letter { font: 400 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.group-done { font: 700 11px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font: 700 10.5px/1 var(--font); font-stretch: 110%; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 10px 5px 8px; }
td { padding: 10px 5px; text-align: center; border-top: 1px solid var(--line); font-size: 14px; font-weight: 500; }
th.name, td.name { text-align: left; }
th:first-child, td:first-child { padding-left: 14px; } th:last-child, td:last-child { padding-right: 14px; }
td.pos { width: 30px; font: 800 13px/1 var(--font); color: var(--muted); }
td.name { font-weight: 700; overflow-wrap: anywhere; }
td.w { font-weight: 900; font-size: 15px; }
td.gd.up { color: var(--up); font-weight: 700; } td.gd.down { color: var(--down); font-weight: 700; }
tr.adv td.pos { color: var(--ball-ink); }
tr.adv td.pos span { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--adv); }
.matches { display: grid; border-top: 1px solid var(--line); padding: 6px; gap: 2px; background: var(--surface-2); }
.m { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; font-size: 14px; }
.m .who { display: grid; gap: 4px; min-width: 0; }
.m + .m { border-top: 1px solid var(--line); border-radius: 0; }
.matches { padding: 2px 6px; gap: 0; }
.m .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m .w { font-weight: 800; }
.sets { display: grid; grid-auto-flow: column; gap: 3px; align-items: center; justify-items: end; }
.setcol { display: grid; gap: 4px; }
.cell { min-width: 24px; height: 21px; padding: 0 5px; display: grid; place-items: center; border-radius: 5px; font: 800 13px/1 var(--font); font-variant-numeric: tabular-nums; background: var(--cell-lose); color: var(--cell-lose-ink); }
.cell.win { background: var(--cell); color: var(--cell-ink); }
.total { font: 900 14px/21px var(--font); color: var(--ink); margin-right: 5px; text-align: center; }
.sub { display: block; font: 600 11px/1.3 var(--font); color: var(--muted); text-align: right; margin-top: 3px; }
.live-tag { display: block; font: 800 11px/1.3 var(--font); letter-spacing: .08em; color: var(--live); text-align: right; white-space: nowrap; }
.empty { color: var(--muted); font-size: 13px; }

/* Bracket */
.bracket-wrap { padding: 2px 0 8px; }
.bracket { display: flex; gap: 30px; min-height: 100%; }
.round { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; gap: 10px; }
.round-body { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 16px; }
.pair { position: relative; display: flex; flex-direction: column; justify-content: space-around; gap: 16px; flex: 1; }
.bm { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: visible; }
.bm .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 11px; font-size: 14px; font-weight: 500; }
.bm .row + .row { border-top: 1px solid var(--line); }
.bm .row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bm .row.w { font-weight: 800; }
.bm .row .cells { display: flex; gap: 3px; flex: none; }
.bm.tbd .row { color: var(--muted); font-style: italic; }
.bm.final { border: 2px solid var(--ink); }
.round:not(:last-child) .bm::after { content: ""; position: absolute; right: -16px; top: 50%; width: 15px; border-top: 2px solid var(--line); }
.round:not(:first-child) .bm::before { content: ""; position: absolute; left: -16px; top: 50%; width: 15px; border-top: 2px solid var(--line); }
.round:not(:last-child) .pair::after { content: ""; position: absolute; right: -17px; top: 25%; bottom: 25%; border-right: 2px solid var(--line); }
.third .bm::before, .third .bm::after { display: none; }
.bm .live-tag { text-align: left; padding: 0 11px 7px; }
.third { margin-top: 10px; display: grid; gap: 8px; }
/* Phones: rounds one under another, no sideways scrolling; each round's matches two per row when they fit. */
@media (max-width: 760px) {
  .bracket { flex-direction: column; gap: 22px; }
  .round-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; }
  .pair { display: contents; }
  .round .bm::before, .round .bm::after, .round .pair::after { display: none; }
  .round h3 { display: flex; align-items: center; gap: 10px; }
  .round h3::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .band .inner { padding-block: 14px 24px; gap: 18px; }
  .groups { grid-template-columns: 1fr; }
}
.champion { display: inline-flex; align-items: center; gap: 6px; }
.champion::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 2px var(--ink); flex: none; }

.foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 13px; padding-top: 14px; border-top: 1px solid var(--line); }
.foot a { color: var(--ink); font-weight: 800; text-decoration: none; border-bottom: 2px solid var(--ball); }
</style>
</head>

  en: { live: "Live", done: "Finished", main: "Main draw", cons: "Consolation draw", code: "Join code", getApp: "Get RacketCall", tables: "Groups", levels: "levels", players: "players" },
  es: { live: "En juego", done: "Terminado", main: "Cuadro principal", cons: "Consolación", code: "Código", getApp: "Descargar RacketCall", tables: "Grupos", levels: "niveles", players: "jugadores" },
  ru: { live: "Идёт", done: "Завершён", main: "Основная сетка", cons: "Утешительная сетка", code: "Код для входа", getApp: "Скачать RacketCall", tables: "Группы", levels: "уровней", players: "участников" },
  de: { live: "Läuft", done: "Beendet", main: "Hauptrunde", cons: "Trostrunde", code: "Beitrittscode", getApp: "RacketCall laden", tables: "Gruppen", levels: "Stufen", players: "Spieler" },
  fr: { live: "En cours", done: "Terminé", main: "Tableau principal", cons: "Consolation", code: "Code d'accès", getApp: "Télécharger RacketCall", tables: "Poules", levels: "niveaux", players: "joueurs" },
  it: { live: "In corso", done: "Concluso", main: "Tabellone principale", cons: "Consolazione", code: "Codice", getApp: "Scarica RacketCall", tables: "Gironi", levels: "livelli", players: "giocatori" },
  pt: { live: "Em andamento", done: "Encerrado", main: "Chave principal", cons: "Consolação", code: "Código", getApp: "Baixar RacketCall", tables: "Grupos", levels: "níveis", players: "jogadores" },
  nl: { live: "Bezig", done: "Afgelopen", main: "Hoofdtabel", cons: "Troostronde", code: "Toegangscode", getApp: "RacketCall downloaden", tables: "Poules", levels: "niveaus", players: "spelers" },
  sv: { live: "Pågår", done: "Avslutad", main: "Huvudslutspel", cons: "Tröstslutspel", code: "Kod", getApp: "Hämta RacketCall", tables: "Grupper", levels: "nivåer", players: "spelare" },
  cs: { live: "Probíhá", done: "Ukončený", main: "Hlavní pavouk", cons: "Útěcha", code: "Kód", getApp: "Stáhnout RacketCall", tables: "Skupiny", levels: "úrovně", players: "hráčů" },
  pl: { live: "Trwa", done: "Zakończony", main: "Drabinka główna", cons: "Pocieszenie", code: "Kod", getApp: "Pobierz RacketCall", tables: "Grupy", levels: "poziomy", players: "graczy" },
};
const lang = (navigator.language || "en").slice(0, 2);
const t = Object.assign({}, T.en, X.en, T[lang] || {}, X[lang] || {});
const code = (new URLSearchParams(location.search).get("code") || "").replace(/[^a-zA-Z0-9]/g, "").slice(0, 6).toUpperCase();
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
document.documentElement.lang = lang;
$("title").textContent = t.title; $("hint").textContent = t.hint;
for (const ch of (code || "——————").padEnd(6, "—")) $("code").appendChild(el("span", "", ch));
$("codeLabel").textContent = t.code;
$("open").textContent = t.open; $("open").href = "courtcall://t?code=" + encodeURIComponent(code);
$("store").textContent = t.store; $("getApp").textContent = t.getApp;

// --- The same rules as the app (Packages/ScoreKit/ClubTournament.swift) ---
const key = (o) => Object.keys(o)[0];
const winnerOf = (r) => { if (!r) return null; let a = 0, b = 0; for (const s of r.sets) { if (s.a > s.b) a++; else if (s.b > s.a) b++; } return a === b ? null : (a > b ? "a" : "b"); };
const games = (r) => r.sets.reduce((g, s) => ({ a: g.a + s.a, b: g.b + s.b }), { a: 0, b: 0 });

function standings(div, group) {
  const rows = new Map(div.groups[group].map((p) => [p, { player: p, played: 0, wins: 0, gw: 0, gl: 0 }]));
  const ms = div.matches.filter((m) => key(m.stage) === "group" && m.stage.group._0 === group);
  for (const m of ms) {
    if (key(m.a) !== "player" || key(m.b) !== "player" || !m.result) continue;
    const a = m.a.player._0, b = m.b.player._0, g = games(m.result), w = winnerOf(m.result);
    for (const [p, own, other, side] of [[a, g.a, g.b, "a"], [b, g.b, g.a, "b"]]) {
      const r = rows.get(p); if (!r) continue; r.played++; r.gw += own; r.gl += other; if (w === side) r.wins++;
    }
  }
  const rank = (tied, criteria) => {
    if (tied.length < 2) return tied;
    if (!criteria.length) return tied.sort((x, y) => div.lots[x] - div.lots[y]);
    const set = new Set(tied), c = criteria[0];
    const value = (p) => {
      const r = rows.get(p);
      if (c === "wins") return r.wins; if (c === "gameDifference") return r.gw - r.gl; if (c === "gamesWon") return r.gw;
      return ms.filter((m) => key(m.a) === "player" && key(m.b) === "player" && set.has(m.a.player._0) && set.has(m.b.player._0)
        && winnerOf(m.result) && (winnerOf(m.result) === "a" ? m.a.player._0 : m.b.player._0) === p).length;
    };
    const buckets = new Map(); for (const p of tied) { const v = value(p); if (!buckets.has(v)) buckets.set(v, []); buckets.get(v).push(p); }
    return [...buckets.keys()].sort((x, y) => y - x).flatMap((v) => rank(buckets.get(v), criteria.slice(1)));
  };
  return rank([...div.groups[group]], div.rules.ranking).map((p) => rows.get(p));
}
const groupDone = (div, g) => div.matches.every((m) => key(m.stage) !== "group" || m.stage.group._0 !== g || m.result);
function participant(div, e) {
  const k = key(e);
  if (k === "player") return e.player._0;
  if (k === "bye") return "bye";
  if (k === "groupPlace") { const { group, place } = e.groupPlace; if (!groupDone(div, group)) return null; const s = standings(div, group); return place - 1 < s.length ? s[place - 1].player : "bye"; }
  const id = e[k].of, m = div.matches.find((x) => x.id === id); if (!m) return null;
  const a = participant(div, m.a), b = participant(div, m.b), wants = k === "winner";
  if (a === "bye" && b === "bye") return "bye";
  if (a === "bye") return wants ? b : "bye"; if (b === "bye") return wants ? a : "bye";
  const w = winnerOf(m.result); if (!w) return null;
  return (w === "a") === wants ? a : b;
}

function render(data) {
  const board = $("board"), levels = $("levels"); board.innerHTML = ""; levels.innerHTML = "";
  $("title").textContent = data.name;
  const status = $("status"); status.hidden = false;
  status.textContent = data.status === "finished" ? t.done : t.live;
  status.className = "pill" + (data.status === "finished" ? "" : " live");
  const results = new Map(data.results.map((r) => [String(r.match_id).toLowerCase(), r]));
  const live = new Map((data.live || []).filter((l) => l.match_id && l.state).map((l) => [String(l.match_id).toLowerCase(), l.state]));
  hasLive = live.size > 0;
  const divisions = data.tournament.divisions;
  for (const d of divisions) for (const m of d.matches) { const r = results.get(m.id.toLowerCase()); if (r && !r.disputed) m.result = { sets: r.sets }; m.meta = r; }
  const people = divisions.reduce((n, d) => n + d.players.length, 0);
  $("eyebrow").textContent = data.starts_at ? new Date(data.starts_at).toLocaleDateString(lang, { weekday: "long", day: "numeric", month: "long" }) : "";
  $("hint").textContent = (divisions.length > 1 ? divisions.length + " " + t.levels + " · " : "") + people + " " + t.players;
  $("invite").hidden = data.status === "finished";
  let current = 0; try { current = Math.min(Number(sessionStorage.getItem("level") || 0), divisions.length - 1); } catch (e) {}
  if (divisions.length > 1) divisions.forEach((d, i) => {
    const b = el("button", i === current ? "on" : "", d.rules.name); b.type = "button";
    b.onclick = () => { try { sessionStorage.setItem("level", i); } catch (e) {} render(data); }; levels.appendChild(b);
  });
  levels.hidden = divisions.length < 2;
  const div = divisions[current];
  const pname = (e) => { const p = participant(div, e); return p === null ? t.pending : p === "bye" ? "—" : div.players[p].name; };
  // Scoreboard cells: one column per set, the winner of each set filled; more than one set leads with the sets score.
  const setCells = (m) => {
    const box = el("div", "sets"); if (!m.result) return box;
    const sets = m.result.sets;
    if (sets.length > 1) { const w = sets.reduce((c, s) => ({ a: c.a + (s.a > s.b), b: c.b + (s.b > s.a) }), { a: 0, b: 0 });
      const col = el("div", "setcol"); col.append(el("span", "total", w.a), el("span", "total", w.b)); box.appendChild(col); }
    for (const s of sets) { const col = el("div", "setcol");
      col.append(el("span", "cell" + (s.a > s.b ? " win" : ""), s.a), el("span", "cell" + (s.b > s.a ? " win" : ""), s.b)); box.appendChild(col); }
    return box;
  };
  const liveText = (m) => { const now = live.get(m.id.toLowerCase()); if (!now || m.result) return null;
    return (now.gamesA != null ? now.gamesA + "–" + now.gamesB + " · " : "") + now.pointsA + "–" + now.pointsB; };

  // Groups
  const adv = (div.rules.playoffs[0] || { places: [0, 0] }).places[1];
  board.appendChild(el("h2", "", t.tables));
  const grid = el("div", "groups"); board.appendChild(grid);
  div.groups.forEach((_, g) => {
    const card = el("article", "card group"), head = el("div", "group-head");
    head.append(el("span", "group-letter", t.group + " " + String.fromCharCode(65 + g)));
    card.appendChild(head);
    const table = el("table"), hr = el("tr");
    for (const [c, cls] of [["#", "name"], [t.player, "name"], [t.w, ""], [t.gp, ""], [t.gm, ""], ["±", ""]]) hr.appendChild(el("th", cls, c));
    if (groupDone(div, g)) head.append(el("span", "group-done", t.done));
    table.appendChild(hr);
    standings(div, g).forEach((r, i) => {
      const tr = el("tr", i < adv ? "adv" : ""), d = r.gw - r.gl;
      const pos = el("td", "pos"); pos.appendChild(el("span", "", i + 1));
      tr.append(pos, el("td", "name", div.players[r.player].name), el("td", "w", r.wins),
                el("td", "", r.gw), el("td", "", r.gl), el("td", "gd" + (d > 0 ? " up" : d < 0 ? " down" : ""), (d > 0 ? "+" : "") + d));
      table.appendChild(tr);
    });
    const tw = el("div", "table-wrap"); tw.appendChild(table); card.appendChild(tw);
    const list = el("div", "matches");
    div.matches.filter((m) => key(m.stage) === "group" && m.stage.group._0 === g).forEach((m) => {
      const row = el("div", "m"), who = el("div", "who"), w = winnerOf(m.result);
      who.append(el("span", w === "a" ? "w" : "", pname(m.a)), el("span", w === "b" ? "w" : "", pname(m.b)));
      const sc = el("div", "score"), lt = liveText(m); sc.appendChild(setCells(m));
      if (lt) sc.appendChild(el("span", "live-tag", t.live + " " + lt));
      if (m.meta && !m.meta.confirmed && !m.meta.disputed) sc.appendChild(el("span", "sub", t.unconfirmed));
      row.append(who, sc); list.appendChild(row);
    });
    card.appendChild(list); grid.appendChild(card);
  });

  // Playoffs: rounds as columns, pairs joined by bracket lines.
  div.rules.playoffs.forEach((rule, bracket) => {
    const ms = div.matches.filter((m) => key(m.stage) === "playoff" && m.stage.playoff.bracket === bracket);
    const third = div.matches.filter((m) => key(m.stage) === "thirdPlace" && m.stage.thirdPlace.bracket === bracket);
    if (!ms.length) return;
    board.appendChild(el("h2", "", bracket === 0 ? t.main : t.cons));
    const wrap = el("div", "bracket-wrap"), row = el("div", "bracket"); wrap.appendChild(row); board.appendChild(wrap);
    const last = Math.max(...ms.map((m) => m.stage.playoff.round));
    const first = Math.min(...ms.filter((m) => key(m.a) !== "bye" && key(m.b) !== "bye").map((m) => m.stage.playoff.round));
    for (let r = first; r <= last; r++) {
      const col = el("div", "round"), body = el("div", "round-body");
      col.appendChild(el("h3", "", last - r === 0 ? t.final : last - r === 1 ? t.semis : last - r === 2 ? t.quarters : t.round + " " + r));
      const list = ms.filter((m) => m.stage.playoff.round === r);
      for (let i = 0; i < list.length; i += 2) {
        const pair = el("div", "pair");
        for (const m of list.slice(i, i + 2)) pair.appendChild(bracketMatch(m, r === last));
        body.appendChild(pair);
      }
      col.appendChild(body);
      if (r === last && third.length) {
        const t3 = el("div", "third"); t3.appendChild(el("h3", "", t.third));
        third.forEach((m) => t3.appendChild(bracketMatch(m, false))); col.appendChild(t3);
      }
      row.appendChild(col);
    }
  });

  function bracketMatch(m, isFinal) {
    const a = participant(div, m.a), b = participant(div, m.b), w = winnerOf(m.result);
    const card = el("div", "bm" + (a === null || b === null ? " tbd" : "") + (isFinal ? " final" : ""));
    for (const [side, p] of [["a", a], ["b", b]]) {
      const r = el("div", "row" + (w === side ? " w" : ""));
      const nm = el("span", "", p === null ? t.pending : p === "bye" ? "—" : div.players[p].name);
      if (isFinal && w === side) nm.className = "champion";
      const pts = el("span", "cells");
      if (m.result) for (const s of m.result.sets) { const own = side === "a" ? s.a : s.b, other = side === "a" ? s.b : s.a; pts.appendChild(el("span", "cell" + (own > other ? " win" : ""), own)); }
      r.append(nm, pts); card.appendChild(r);
    }
    const lt = liveText(m);
    if (lt) card.appendChild(el("span", "live-tag", t.live + " " + lt));
    return card;
  }
  $("updated").textContent = t.updated + " " + new Date().toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });
}

async function load() {
  if (code.length !== 6) return;
  try {
    const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/public_club_tournament", {
      method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_code: code }) });
    const data = await response.json();
    if (data && data.tournament) render(data); else $("updated").textContent = t.notFound;
  } catch (e) { /* offline: keep what's on screen */ }
}
// Every 15 seconds while a match is live, otherwise every minute.
async function loop() { await load(); setTimeout(loop, hasLive ? 15000 : 60000); }
loop();
</script>
