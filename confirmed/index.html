<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed — RacketCall</title>
<meta name="description" content="Your RacketCall email is confirmed.">
<style>
  :root { --bg: #ffffff; --fg: #1c1c1e; --muted: #6e6e73; --accent: #0a84ff; --line: #e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #f2f2f7; --muted: #98989d; --accent: #64d2ff; --line: #2c2c2e; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  nav { display: flex; gap: 12px; margin-bottom: 24px; }
  nav a { color: var(--accent); text-decoration: none; font-weight: 600; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 28px 0 8px; }
  .date { color: var(--muted); margin: 0 0 24px; }
  section + section { border-top: 1px solid var(--line); margin-top: 48px; padding-top: 32px; }
  ul { padding-left: 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<section lang="en">
<h1>Email confirmed ✓</h1>
<p>Your RacketCall account is ready. Go back to the app and sign in.</p>
</section>
<section lang="es">
<h1>Correo confirmado ✓</h1>
<p>Tu cuenta de RacketCall está lista. Vuelve a la app e inicia sesión.</p>
</section>
<section lang="ru">
<h1>Почта подтверждена ✓</h1>
<p>Аккаунт RacketCall готов. Вернитесь в приложение и войдите.</p>
</section>

</main>
</body>
</html>
