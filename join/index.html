<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a community — RacketCall</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #ffffff; --fg: #1c1c1e; --muted: #6e6e73; --accent: #0a84ff; --line: #e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #f2f2f7; --muted: #98989d; --accent: #64d2ff; --line: #2c2c2e; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .code { font: 700 34px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 4px;
          padding: 16px; border: 1px solid var(--line); border-radius: 16px; margin: 0 0 12px; user-select: all; }
  a.button, button { display: block; width: 100%; box-sizing: border-box; font: inherit; font-weight: 600; padding: 14px;
                     border-radius: 14px; border: 0; cursor: pointer; text-decoration: none; margin-top: 12px; }
  .primary { background: var(--accent); color: #000; }
  .secondary { background: transparent; color: var(--accent); border: 1px solid var(--line) !important; }
  .steps { text-align: left; color: var(--muted); font-size: 15px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Join a community</h1>
  <p id="hint"></p>
  <div class="code" id="code">—</div>
  <button class="secondary" id="copy"></button>
  <a class="button primary" id="open" href="#"></a>
  <a class="button secondary" id="store" href="https://apps.apple.com/app/id6828844909"></a>
  <ol class="steps" id="steps"></ol>
</main>
<script>
const T = {
  en: { title: "Join a community", hint: "You've been invited to a RacketCall community.", copy: "Copy code", copied: "Copied",
        open: "Open in RacketCall", store: "Get RacketCall on the App Store",
        steps: ["Install RacketCall and sign in.", "Community → Groups → Join with a code.", "Paste the code and tap Join."] },
  es: { title: "Únete a una comunidad", hint: "Te han invitado a una comunidad de RacketCall.", copy: "Copiar código", copied: "Copiado",
        open: "Abrir en RacketCall", store: "Descargar RacketCall en el App Store",
        steps: ["Instala RacketCall e inicia sesión.", "Comunidad → Grupos → Unirse con código.", "Pega el código y toca Unirse."] },
  ru: { title: "Вступить в сообщество", hint: "Вас пригласили в сообщество RacketCall.", copy: "Скопировать код", copied: "Скопировано",
        open: "Открыть в RacketCall", store: "Скачать RacketCall в App Store",
        steps: ["Установите RacketCall и войдите.", "Сообщество → Группы → Вступить по коду.", "Вставьте код и нажмите «Вступить»."] },
};
const lang = (navigator.language || "en").slice(0, 2);
const t = T[lang] || T.en;
// Only letters and digits: the code comes from the address bar.
const code = (new URLSearchParams(location.search).get("code") || location.pathname.split("/join/")[1] || "")
  .replace(/[^a-zA-Z0-9]/g, "").slice(0, 16).toLowerCase();
document.documentElement.lang = lang;
document.getElementById("title").textContent = t.title;
document.getElementById("hint").textContent = t.hint;
document.getElementById("code").textContent = code || "—";
document.getElementById("copy").textContent = t.copy;
document.getElementById("open").textContent = t.open;
document.getElementById("open").href = "courtcall://join?code=" + encodeURIComponent(code);
document.getElementById("store").textContent = t.store;
t.steps.forEach(step => { const li = document.createElement("li"); li.textContent = step; document.getElementById("steps").appendChild(li); });
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(code); document.getElementById("copy").textContent = t.copied; } catch (e) {}
};
</script>
</body>
</html>
